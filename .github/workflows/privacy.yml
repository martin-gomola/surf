name: Privacy

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit identities and tracked paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
          elif [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ]; then
            base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)"
          else
            base="$BEFORE_SHA"
          fi
          bash scripts/privacy-check.sh "$base" HEAD

      - name: Scan complete Git history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
