name: Docker CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker backend and client core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Test Docker backend and shared client core
        run: make test

      - name: Build runtime image
        run: cp packaging/docker/.env.example packaging/docker/.env && docker compose -f packaging/docker/docker-compose.yml build surf

      - name: Verify tracked files stayed clean
        run: git diff --exit-code

  native-package:
    name: iOS 6/7 universal package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache verified iOS SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/buildenv/sdk
          key: native-sdk-${{ hashFiles('native/buildenv/fetch-sdk.sh') }}

      - name: Fetch and verify iOS SDK
        run: make native-sdk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build pinned Theos environment
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: native/buildenv
          load: true
          tags: surf-buildenv:latest
          cache-from: type=gha,scope=native-buildenv
          cache-to: type=gha,scope=native-buildenv,mode=max

      - name: Build and verify package
        run: make client

      - name: Verify tracked files stayed clean
        run: git diff --exit-code
