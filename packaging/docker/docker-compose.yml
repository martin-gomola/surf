services:
  surf:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
      args:
        SURF_VERSION: ${SURF_VERSION:?set SURF_VERSION}
        SURF_COMPATIBILITY: ${SURF_COMPATIBILITY:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      SURF_SERVER_NAME: ${SURF_SERVER_NAME:-Surf}
      SURF_PUBLIC_ADDRESS: ${SURF_PUBLIC_ADDRESS:-}
      SURF_TUNNEL_HOST: ${SURF_TUNNEL_HOST:-}
      SURF_CONTENT_BLOCKER: ${SURF_CONTENT_BLOCKER:-true}
      SURF_BROWSER_VISIBLE: "true"
      SURF_ADAPTIVE_VIDEO: ${SURF_ADAPTIVE_VIDEO:-true}
      SURF_SUSPEND_SILENT_AUDIO: ${SURF_SUSPEND_SILENT_AUDIO:-true}
      STREAM_MAX_FPS: ${STREAM_MAX_FPS:-30}
      SURF_DASHBOARD_ADDR: 0.0.0.0:18081
      SURF_DASHBOARD_PUBLIC_URL: http://127.0.0.1:${SURF_DASHBOARD_PORT:-18081}/
      DISPLAY: :99
      PORT: 8080
      SURF_HOME: /data/surf
      PROFILE: /data/profile
      DOWNLOADS: /data/downloads
      UPLOADS: /data/uploads
      CHROME: /usr/bin/chromium
    ports:
      - "${SURF_PORT:-18080}:8080"
      - "127.0.0.1:${SURF_DASHBOARD_PORT:-18081}:18081"
    shm_size: "1g"
    volumes:
      - ${SURF_DATA_ROOT}/runtime:/data/surf
      - ${SURF_DATA_ROOT}/profile:/data/profile
      - ${SURF_DATA_ROOT}/downloads:/data/downloads
      - ${SURF_DATA_ROOT}/uploads:/data/uploads

  benchmark:
    image: node:26-bookworm-slim
    profiles: [tools]
    network_mode: service:surf
    depends_on: [surf]
    command: ["node", "/benchmark-scroll.mjs", "${SURF_BENCHMARK_SECONDS:-60}"]
    volumes:
      - ${SURF_DATA_ROOT}/profile:/profile:ro
      - ${SURF_DATA_ROOT}/runtime:/surf-home:ro
      - ./benchmark-scroll.mjs:/benchmark-scroll.mjs:ro
